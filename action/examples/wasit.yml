# Wasit on every pull request and every push to main.
#
# What this does: starts your x402 service inside the job (service.start in
# wasit.config.json), runs Wasit's read-only challenge checks against it,
# comments the result on the pull request, and compares it with the last run on
# main. The job named Wasit is the check on the pull request.
#
# Replace <tag-or-commit-sha> below with a release tag or a full commit SHA of
# the Wasit repository. Do not use a branch name.
#
# Wasit needs Node 22 or later and does not install it: keep the setup-node step.
#
# A header your service needs to issue a challenge: set it with WASIT_HEADER_<NAME>
# in the env: of the Wasit step, from a secret, for example
#   env:
#     WASIT_HEADER_X_API_KEY: ${{ secrets.X_API_KEY }}
# The service Wasit starts is not given that variable, and neither is it given
# the key variables or WASIT_RPC_URL. Never put a key in wasit.config.json.
#
# Do not use pull_request_target. It would give the code of a pull request the
# token and the secrets of your repository.

name: Wasit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  actions: read
  # Optional: lets Wasit add its own check, "Wasit conformance", with the result
  # of each check. Without it the action works the same and skips that check.
  checks: write

# One Wasit run per pull request: a newer push cancels the older run, so two runs
# never write the pull request's comment over each other. Any other run (a push to
# main, a schedule, a run started by hand) has a group of its own: nothing waits
# for it and nothing cancels it, since a run there may be paying.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('wasit-pr-{0}', github.event.pull_request.number) || format('wasit-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wasit:
    name: Wasit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The payment tier (test networks only, at most $1.00 a payment and $5.00 a
      # run) also runs X402-06 to X402-10. It pays on push to main, schedule and
      # workflow_dispatch; on a pull request it runs the read-only checks. To use
      # it, store a dedicated testnet payer as a repository secret and change this
      # step to:
      #   with:
      #     config: wasit.config.json
      #     tier: payment
      #   env:
      #     STELLAR_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && secrets.WASIT_TESTNET_PAYER || '' }}
      # Give the key on this step only, never in a job-level env: the earlier
      # steps of this job (an npm ci with install scripts) would get it too. A key
      # given to a pull request run is refused before your service starts. On a
      # GitHub-hosted runner your service then runs as a separate user, so it
      # cannot read the key from Wasit's process; code that ran earlier in the job
      # as the runner's user is not kept from it.
      - uses: wasit-dev/wasit/action@<tag-or-commit-sha>
        with:
          config: wasit.config.json
